VENCIMIENTOS NEW (Con AJUSTE Función Formateo Fechas DATE)


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vencimientos Servicios/Cuentas - Sincronizado</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 30px 16px;
  }
  #sheet-sync-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 20px 24px;
  }
  #sheet-sync-container h1 {
    font-size: 18px;
    margin: 0 0 16px 0;
  }
  .sheet-sync-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .sheet-sync-header span {
    font-size: 13px;
    color: #666;
  }
  #sheet-sync-refresh {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid #ccc;
    background: #f7f7f7;
    border-radius: 6px;
    cursor: pointer;
  }
  #sheet-sync-refresh:hover { background: #eee; }
  #sheet-sync-status {
    font-size: 13px;
    color: #999;
    margin-bottom: 8px;
    min-height: 16px;
  }
  #sheet-sync-list .record {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #ddd;
  }
  #sheet-sync-list .record:last-child {
    border-bottom: none;
  }
  #sheet-sync-list .record a {
    color: #1a73e8;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  #sheet-sync-list .record a:hover { text-decoration: underline; }
  #sheet-sync-list .record .raw-url {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    color: #666;
    font-family: monospace;
    word-break: break-all;
  }
  #sheet-sync-list .record .extra-field {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    color: #444;
  }
  #sheet-sync-list .record .extra-field a {
    font-weight: normal;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="sheet-sync-container">
  <h1>VENCIMIENTOS SERVICIOS</h1>
  <div class="sheet-sync-header">
    <span>Última sincronización: <span id="sheet-sync-time">—</span></span>
    <button id="sheet-sync-refresh">Actualizar ahora</button>
  </div>
  <div id="sheet-sync-status"></div>
  <div id="sheet-sync-list"></div>
</div>

<script>
(function () {
  // --- Configuración ---
  const SHEET_ID = "1qngk4DZZIaTktjz1LNGMgeKTsaGfLDhsucJhiEWh0Wg";
  const GID = "0";
  const REFRESH_MS = 86400000; // vuelve a sincronizar cada 60 segundos
  const EMPTY_PLACEHOLDER = "-"; // texto para celdas sin valor

  // Nombres de encabezado tal como figuran en la fila 1 de la planilla.
  // El código busca estas columnas por nombre, sin importar en qué posición estén.
  const HEADER_DOMICILIO = "Domicilio";
  const HEADER_URL = "URL";
  const HEADER_BD = "Link BasedeDatos Softr";
  const HEADER_ANIO = "Año";
  const HEADER_ALBUM = "Álbum Spotify";

  const HEADER_SERVICIO = "Servicio";


  const HEADER_VENC1 = "1erVencimiento";
  const HEADER_VENC2 = "2doVencimiento";
  const HEADER_IMPORTE1 = "Importe1";
  const HEADER_IMPORTE2 = "Importe2";
  const HEADER_PAGO = "Pago"
  const HEADER_FECHAPAGO = "Fecha de Pago";
  const HEADER_IMPORTEP = "ImporteP";


  const HEADER_STUDIO = "Link Studio.softr.io";

  const HEADER_ESTADO = "Estado";


  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;

  const statusEl = document.getElementById("sheet-sync-status");
  const timeEl = document.getElementById("sheet-sync-time");
  const listEl = document.getElementById("sheet-sync-list");

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Busca el índice de columna cuyo encabezado coincide (sin importar mayúsculas/tildes de espacio) con el nombre buscado
  function findColIndex(cols, headerName) {
    const target = headerName.trim().toLowerCase();
    return cols.findIndex(c => (c.label || "").trim().toLowerCase() === target);
  }

  // Devuelve el valor de una celda como texto, o el placeholder si está vacía / la columna no existe
  function cellValue(row, colIndex) {
    if (colIndex === -1) return "";
    const cell = row.c[colIndex];
    if (!cell || cell.v === null || cell.v === undefined || String(cell.v).trim() === "") return "";
    return String(cell.v);
  }

  // Convierte el valor crudo de gviz (que puede venir como "Date(AAAA,MM,DD)")
  // a un string en formato DD/MM/AAAA. Si no matchea ese patrón, devuelve el valor tal cual.
  function formatDateValue(rawValue) {
    const match = String(rawValue).match(/^Date\((\d+),(\d+),(\d+)/);
    if (match) {
      const year = match[1];
      const month = String(Number(match[2]) + 1).padStart(2, "0"); // +1 porque gviz usa mes en base 0
      const day = String(match[3]).padStart(2, "0");
      return `${day}/${month}/${year}`;
    }
    return String(rawValue);
  }

  async function syncSheet() {
    statusEl.textContent = "Sincronizando...";
    try {
      const res = await fetch(url);
      const text = await res.text();
      // La respuesta viene envuelta como: google.visualization.Query.setResponse({...});
      const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
      const rows = json.table.rows;
      const cols = json.table.cols;

      // Ubicación dinámica de columnas por nombre de encabezado
      const idxDomicilio = findColIndex(cols, HEADER_DOMICILIO);

      const idxServicio = findColIndex(cols, HEADER_SERVICIO);

      const idxURL = findColIndex(cols, HEADER_URL);
      const idxBD = findColIndex(cols, HEADER_BD);
      const idxAnio = findColIndex(cols, HEADER_ANIO);
      const idxAlbum = findColIndex(cols, HEADER_ALBUM);


      const idxVenc1 = findColIndex(cols, HEADER_VENC1);
      const idxVenc2 = findColIndex(cols, HEADER_VENC2);
      const idxImporte1 = findColIndex(cols, HEADER_IMPORTE1);
      const idxImporte2 = findColIndex(cols, HEADER_IMPORTE2);
      const idxPago = findColIndex(cols, HEADER_PAGO);
      const idxFechapago = findColIndex(cols, HEADER_FECHAPAGO);
      const idxImportep = findColIndex(cols, HEADER_IMPORTEP);


      const idxStudio = findColIndex(cols, HEADER_STUDIO);

      const idxEstado = findColIndex(cols, HEADER_ESTADO);


      if (idxDomicilio === -1 || idxServicio === -1) {
        statusEl.textContent = `No se encontraron las columnas "${HEADER_DOMICILIO}" y/o "${HEADER_SERVICIO}" en la planilla.`;
        return;
      }

      listEl.innerHTML = rows
        .filter(r => cellValue(r, idxDomicilio) && cellValue(r, idxServicio)) // exige al menos Nombre y Link
        .map(r => {
          const domicilioRaw = cellValue(r, idxDomicilio);

          const servicioRaw = cellValue(r, idxServicio);

          const urlRaw = cellValue(r, idxURL);
          const bdRaw = cellValue(r, idxBD);
          const anioRaw = cellValue(r, idxAnio) || EMPTY_PLACEHOLDER;
          const albumRaw = cellValue(r, idxAlbum) || EMPTY_PLACEHOLDER;
          const esAlbumLink = /^https?:\/\//i.test(albumRaw);


          const venc1Raw = (cellValue(r, idxVenc1) ? formatDateValue(cellValue(r, idxVenc1)) : "") || EMPTY_PLACEHOLDER;
          const venc2Raw = (cellValue(r, idxVenc2) ? formatDateValue(cellValue(r, idxVenc2)) : "") || EMPTY_PLACEHOLDER;
          const importe1Raw = cellValue(r, idxImporte1) || EMPTY_PLACEHOLDER;
          const importe2Raw = cellValue(r, idxImporte2) || EMPTY_PLACEHOLDER;
          const pagoRaw = cellValue(r, idxPago) || EMPTY_PLACEHOLDER;
          const fechapagoRaw = (cellValue(r, idxFechapago) ? formatDateValue(cellValue(r, idxFechapago)) : "") || EMPTY_PLACEHOLDER;
          const importepRaw = cellValue(r, idxImportep) || EMPTY_PLACEHOLDER;


          const studioRaw = cellValue(r, idxStudio) || EMPTY_PLACEHOLDER;
          const esStudioLink = /^https?:\/\//i.test(studioRaw);

          const estadoRaw = cellValue(r, idxEstado) || EMPTY_PLACEHOLDER;



          const domicilio = escapeHtml(domicilioRaw);

          const servicio = escapeHtml(servicioRaw);

          const url = escapeHtml(urlRaw);
          const bd = escapeHtml(bdRaw);
          const anio = escapeHtml(anioRaw);
          const album = escapeHtml(albumRaw);


          const venc1 = escapeHtml(venc1Raw);
          const venc2 = escapeHtml(venc2Raw);
          const importe1 = escapeHtml(importe1Raw);
          const importe2 = escapeHtml(importe2Raw);
          const pago = escapeHtml(pagoRaw);
          const fechapago = escapeHtml(fechapagoRaw);
          const importep = escapeHtml(importepRaw);


          const studio = escapeHtml(studioRaw);
          const estado = escapeHtml(estadoRaw);


          return `
            <div class="record">
              <a href="${url}" target="_blank" rel="noopener">${domicilio}</a>

              <span class="raw-url">"${servicio}"</span>

              <span class="extra-field"><strong>Servicio:</strong> ${servicio}</span>

              <span class="raw-url">"${url}"</span>


              <span class="extra-field"><strong>1er Vencimiento:</strong> ${venc1}</span>
              <span class="extra-field"><strong>Importe 1er Vto.:</strong> ${importe1}</span>

              <span class="extra-field"><strong>2do Vencimiento:</strong> ${venc2}</span>              
              <span class="extra-field"><strong>Importe 2do Vto.:</strong> ${importe2}</span>

              <span class="extra-field"><strong>Pago:</strong> ${pago}</span>

              <span class="extra-field"><strong>Fecha Pagado:</strong> ${fechapago}</span>              
              <span class="extra-field"><strong>Importe Pagado:</strong> ${importep}</span>


              <!-- <a href="${bd}" target="_blank" rel="noopener">${domicilio}</a> -->
              <span class="extra-field"><strong>BasedeDatos: </strong><a href="${bd}" target="_blank" rel="noopener">${domicilio}</a></span>

              <span class="extra-field"><strong>Año:</strong> ${anio}</span>
              <span class="extra-field"><strong>A:</strong> ${esAlbumLink ? `<a href="${album}" target="_blank" rel="noopener">${album}</a>` : album}</span>

              <span class="extra-field"><strong>Studio.softr.io: </strong>${esStudioLink ? `<a href="${studio}" target="_blank" rel="noopener">abrir Editor App en Studio.softr.io/Applications/</a>` : studio}</span>

              <span class="extra-field"><strong>Estado:</strong> ${estado}</span>

              <br>
            </div>`;
        })
        .join("");

      if (!listEl.innerHTML) {
        listEl.innerHTML = '<p style="color:#999;font-size:14px;">No se encontraron registros.</p>';
      }

      statusEl.textContent = "";
      timeEl.textContent = new Date().toLocaleTimeString();
    } catch (err) {
      statusEl.textContent = "No se pudo sincronizar. Verificá que la hoja sea pública ('cualquiera con el enlace').";
      console.error(err);
    }
  }

  document.getElementById("sheet-sync-refresh").addEventListener("click", syncSheet);
  syncSheet();
  setInterval(syncSheet, REFRESH_MS);
})();
</script>

</body>
</html>
